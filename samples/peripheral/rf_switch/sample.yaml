sample:
  description: RF Switch control sample for MikroE Click RF Switch using GPIO (ON pin) and PWM (SEL pin)
  name: RF Switch

common:
  tags:
    - ci_build
    - ci_samples_peripheral_rf_switch
  timeout: 30

tests:
  sample.peripheral.rf_switch:
    platform_allow:
      - nrf52840dk/nrf52840
    integration_platforms:
      - nrf52840dk/nrf52840